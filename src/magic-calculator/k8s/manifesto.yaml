---
apiVersion: v1
kind: Namespace
metadata:
  name: magic
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: magic
  name: magic-calculator
  labels:
    app: magic-calculator
    app.kubernetes.io/name: magic-calculator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: magic-calculator
      tier: frontend
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: magic-calculator
        tier: frontend
    spec:
      containers:
      - env:
        - name: API_URL
          value: http://calculadora-api.calculator.svc.cluster.local/backend
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: signoz-otel-collector.signoz.svc.cluster.local:4317
        image: __IMAGEM__
        imagePullPolicy: IfNotPresent
        name: magic-calculator
        ports:
        - containerPort: 5000
          name: http
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /frontend
            port: http
          initialDelaySeconds: 30
          failureThreshold: 5
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 1
        readinessProbe:
          httpGet:
            path: /frontend
            port: http
          initialDelaySeconds: 30
          failureThreshold: 5
          periodSeconds: 20
          successThreshold: 1
          timeoutSeconds: 1
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  namespace: magic
  name: magic-calculator
  labels:
    app.type.monitor: jvm-app
spec:
  ports:
  - name: http
    port: 80
    protocol: TCP
    targetPort: 5000
  selector:
    app: magic-calculator
    tier: frontend
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  namespace: magic
  name: ingress-magic-calculator
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: __CERTIFICATE_ARN__
spec:
  ingressClassName: alb-external
  rules:
    - http:
        paths:
        - path: /*
          pathType: ImplementationSpecific
          backend:
            service:
              name: magic-calculator
              port:
                number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-magic-calculator
  namespace: magic
spec:
  minReplicas: 1
  maxReplicas: 3
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: magic-calculator
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 80
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
