<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Chuck Norris</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600&display=swap');

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background: #1a1a2e;
            background-image:
                radial-gradient(ellipse at top, #e94560 0%, transparent 60%),
                radial-gradient(ellipse at bottom, #0f3460 0%, transparent 70%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            padding: 20px;
        }

        .hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: -10px;
            position: relative;
            z-index: 2;
        }

        .hero img {
            width: 160px;
            filter: drop-shadow(0 0 24px rgba(233, 69, 96, 0.7));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-8px); }
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(233, 69, 96, 0.4);
            border-radius: 16px;
            padding: 32px 36px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.05);
            text-align: center;
        }

        h1 {
            font-family: 'Bebas Neue', 'Impact', sans-serif;
            font-size: 2rem;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 20px rgba(233, 69, 96, 0.8);
            margin-bottom: 20px;
        }

        .result-badge {
            display: inline-block;
            background: linear-gradient(135deg, #e94560, #c0392b);
            color: #fff;
            font-family: 'Bebas Neue', 'Impact', sans-serif;
            font-size: 3.5rem;
            letter-spacing: 4px;
            padding: 12px 36px;
            border-radius: 12px;
            margin-bottom: 6px;
            box-shadow: 0 4px 20px rgba(233, 69, 96, 0.5);
        }

        .result-label {
            color: rgba(255,255,255,0.4);
            font-size: 0.75rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .joke-box {
            background: rgba(255,255,255,0.06);
            border-left: 4px solid #e94560;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 28px;
            text-align: left;
            color: rgba(255,255,255,0.85);
            font-size: 0.95rem;
            line-height: 1.7;
            font-style: italic;
        }

        .joke-box::before {
            content: '"';
            font-size: 3rem;
            line-height: 0;
            vertical-align: -0.6em;
            color: #e94560;
            font-family: Georgia, serif;
            margin-right: 4px;
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: transparent;
            color: #e94560;
            font-family: 'Bebas Neue', 'Impact', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 3px;
            border: 2px solid #e94560;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, color 0.2s, transform 0.15s;
        }

        .btn:hover {
            background: #e94560;
            color: #fff;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="hero">
        <img src="{{ url_for('img', filename='chuck.png') }}" alt="Chuck Norris">
    </div>
    <div class="card">
        <h1>Chuck Calculou.</h1>
        <div class="result-badge">{{ result }}</div>
        <p class="result-label">resultado da soma</p>

        {% if piada %}
        <div class="joke-box">{{ piada }}</div>
        {% endif %}

        <a href="{{ url_for('voltar') }}" class="btn">CALCULAR NOVAMENTE</a>
    </div>
</body>
</html>
